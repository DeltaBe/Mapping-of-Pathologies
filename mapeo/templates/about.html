{% extends "layouts/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/about.css' %}">
<div class="contenedor-principal">
    <section class="mapa-o-contenido">
        <div class="map-card">
            <div class="map-header">
                <h3>Mapa Epidemiológico por CIE</h3>
                <span class="map-badge">{{ cie_id }}</span>
            </div>
            <iframe
                src="{% static mapa_file %}?v={{ timestamp }}"
                width="100%"
                height="100%"
                style="border: none;">
            </iframe>
        </div>
    </section>

    <aside class="panel-derecho">
        <div class="tarjeta-cie">
            <h4>Filtro por Clave CIE</h4>
            <form method="POST" , action="">
                {% csrf_token %}
                <input type="text" name="cie_id" class="entrada-cie" value="{{ cie_id }}">
                <div class="acciones">
                    <button type="submit" style="width: 100%;" , class="btn-buscar">🔍 Actualizar Búsqueda</button>
                </div>
            </form>
            <div class="cie-ayuda">
                <small>Consultando base de datos en tiempo real.</small>
            </div>
        </div>
    </aside>
</div>
{% endblock %}
